name: Lakehouse CI/CD

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "docs/**"
      - "*.pdf"
      - ".gitignore"
      - "Data/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "docs/**"
      - "*.pdf"
      - ".gitignore"
      - "Data/**"

# Two pushes to main in quick succession would otherwise run `terraform apply`
# against the same state concurrently. Queue them instead of cancelling: a
# half-finished apply that gets cancelled is worse than a slow one.
concurrency:
  group: lakehouse-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_WORKING_DIR: terraform
  TF_VERSION: "~1.10"
  # Glue 4.0 runs Python 3.10 — test on what production executes.
  PYTHON_VERSION: "3.10"

permissions:
  contents: read

jobs:
  # ─── Secret scanning ───────────────────────────────────────────────────────
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          VERSION=8.21.2
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks

      - name: Scan history and working tree
        run: |
          gitleaks detect --redact --verbose --exit-code 1
          gitleaks detect --no-git --redact --verbose --exit-code 1

  # ─── Python: lint + unit tests ─────────────────────────────────────────────
  lint-and-test:
    name: Lint & Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # No CLI overrides — .flake8 is the single source of truth for style,
      # and scripts/ is linted like everything else.
      - name: Lint with flake8
        run: flake8 glue_jobs/ tests/ scripts/

      - name: Format check with black
        run: black --check glue_jobs/ tests/ scripts/

      - name: Run tests
        run: pytest -v --tb=short --cov=glue_jobs --cov-report=term-missing

  # ─── Terraform static analysis (no AWS credentials needed) ────────────────
  terraform-checks:
    name: Terraform Checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Terraform Validate (root)
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init -backend=false
          terraform validate

      - name: Terraform Validate (bootstrap)
        working-directory: ${{ env.TF_WORKING_DIR }}/bootstrap
        run: |
          terraform init -backend=false
          terraform validate

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - name: TFLint
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          tflint --init
          tflint --recursive

      - name: tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: ${{ env.TF_WORKING_DIR }}
          soft_fail: false

  # ─── Plan on pull requests (read-only role) ───────────────────────────────
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: [secret-scan, lint-and-test, terraform-checks]
    # Fork PRs receive no secrets, so role-to-assume would be empty and the
    # credentials step would fail with a confusing error.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository

    permissions:
      id-token: write
      contents: read
      pull-requests: write

    env:
      TF_VAR_aws_region: "us-east-1"
      TF_VAR_environment: "dev"
      TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC, read-only)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          aws-region: "us-east-1"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: Terraform Plan
        id: plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          set +e
          terraform plan -no-color 2>&1 | tee plan.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          exit $EXIT_CODE

      - name: Comment plan on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const planPath = '${{ env.TF_WORKING_DIR }}/plan.txt';
            if (!fs.existsSync(planPath)) return;
            const plan = fs.readFileSync(planPath, 'utf8');
            const truncated = plan.length > 60000 ? plan.slice(0, 60000) + '\n...(truncated)' : plan;
            const status = '${{ steps.plan.outputs.exit_code }}' === '0' ? '✅' : '❌';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## ${status} Terraform Plan\n\`\`\`\n${truncated}\n\`\`\``
            });

  # ─── Apply on main (deploy role) ──────────────────────────────────────────
  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: [secret-scan, lint-and-test, terraform-checks]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    permissions:
      id-token: write
      contents: read

    env:
      TF_VAR_aws_region: "us-east-1"
      TF_VAR_environment: "dev"
      TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: "us-east-1"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      # Glue scripts and common.zip are uploaded by Terraform itself
      # (modules/glue/main.tf) — one owner for one artifact.
      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -auto-approve

      - name: Terraform Output
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform output
