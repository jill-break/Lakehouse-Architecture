name: Lakehouse CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  TF_WORKING_DIR: terraform

jobs:
  # ─── Python: lint + unit tests ─────────────────────────────────────────────
  lint-and-test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          flake8 glue_jobs/ \
            --max-line-length=120 \
            --ignore=E501,W503 \
            --exclude=glue_jobs/common/__init__.py

      - name: Format check with black
        run: black --check glue_jobs/ tests/

      - name: Run unit tests
        run: pytest tests/ -v --tb=short --cov=glue_jobs --cov-report=term-missing

  # ─── Terraform: plan (PRs) + apply (main) in one job ─────────────────────
  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    needs: lint-and-test

    permissions:
      id-token: write
      contents: read
      pull-requests: write

    env:
      TF_VAR_aws_region:   "us-east-1"
      TF_VAR_environment:  "dev"
      TF_VAR_alert_email:  ${{ secrets.ALERT_EMAIL }}
      TF_VAR_github_repo:  "jill-break/Lakehouse-Architecture"

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: "us-east-1"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.5"

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      # On PRs — show the plan as a comment, do not apply
      - name: Terraform Plan (PR only)
        if: github.event_name == 'pull_request'
        working-directory: ${{ env.TF_WORKING_DIR }}
        id: plan
        run: |
          set +e
          terraform plan -no-color 2>&1 | tee plan.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          exit $EXIT_CODE

      - name: Comment plan on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const planPath = '${{ env.TF_WORKING_DIR }}/plan.txt';
            if (!fs.existsSync(planPath)) return;
            const plan = fs.readFileSync(planPath, 'utf8');
            const truncated = plan.length > 60000 ? plan.slice(0, 60000) + '\n...(truncated)' : plan;
            const status = '${{ steps.plan.outputs.exit_code }}' === '0' ? '✅' : '❌';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## ${status} Terraform Plan\n\`\`\`\n${truncated}\n\`\`\``
            });

      # On main push — apply directly (no separate plan artifact needed)
      - name: Terraform Apply (main only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -auto-approve

      - name: Terraform Output
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform output

      - name: Package and upload Glue scripts to S3
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          BUCKET=$(cd ${{ env.TF_WORKING_DIR }} && terraform output -raw s3_bucket_name)
          python scripts/package_glue.py
          aws s3 cp glue_jobs/dist/common.zip            s3://$BUCKET/glue-scripts/common.zip
          aws s3 cp glue_jobs/glue_products.py           s3://$BUCKET/glue-scripts/glue_products.py
          aws s3 cp glue_jobs/glue_orders.py             s3://$BUCKET/glue-scripts/glue_orders.py
          aws s3 cp glue_jobs/glue_order_items.py        s3://$BUCKET/glue-scripts/glue_order_items.py
          aws s3 cp glue_jobs/glue_generate_manifests.py s3://$BUCKET/glue-scripts/glue_generate_manifests.py
          echo "All scripts uploaded to s3://$BUCKET/glue-scripts/"

