name: Upload Data & Trigger Pipeline

on:
  workflow_dispatch:
    inputs:
      data_type:
        description: "Data to upload"
        required: true
        default: "good"
        type: choice
        options:
          - good
          - bad

concurrency:
  group: lakehouse-data-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  upload:
    name: Upload ${{ github.event.inputs.data_type }} data
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    env:
      TF_VAR_aws_region: "us-east-1"
      TF_VAR_environment: "dev"
      TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -q boto3 pandas

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: "us-east-1"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.10"

      - name: Get bucket name
        id: bucket
        working-directory: terraform
        run: |
          terraform init -reconfigure
          echo "name=$(terraform output -raw s3_bucket_name)" >> $GITHUB_OUTPUT

      # Generates the batch, uploads every dataset as CSV, then drops the
      # _READY marker that EventBridge is watching for.
      - name: Upload batch and trigger the pipeline
        run: |
          python scripts/upload_data.py \
            --bucket "${{ steps.bucket.outputs.name }}" \
            --type "${{ github.event.inputs.data_type }}"
