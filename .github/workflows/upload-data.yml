name: Upload Data & Trigger Pipeline

on:
  workflow_dispatch:
    inputs:
      data_type:
        description: 'Data to upload'
        required: true
        default: 'good'
        type: choice
        options:
          - good
          - bad

jobs:
  upload:
    name: Upload ${{ github.event.inputs.data_type }} data
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: pip install boto3 openpyxl pandas -q

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: "us-east-1"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.5"

      - name: Get bucket name
        id: bucket
        working-directory: terraform
        env:
          TF_VAR_aws_region:  "us-east-1"
          TF_VAR_environment: "dev"
          TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
          TF_VAR_github_repo: "jill-break/Lakehouse-Architecture"
        run: |
          terraform init -reconfigure
          echo "name=$(terraform output -raw s3_bucket_name)" >> $GITHUB_OUTPUT

      # ── Good data ─────────────────────────────────────────────────────────
      - name: "[Good] Generate clean data"
        if: github.event.inputs.data_type == 'good'
        run: python scripts/generate_data.py --type good

      - name: "[Good] Upload data files to S3"
        if: github.event.inputs.data_type == 'good'
        run: |
          BUCKET="${{ steps.bucket.outputs.name }}"
          aws s3 cp /tmp/products.csv     s3://$BUCKET/raw/products/products.csv
          aws s3 cp /tmp/orders.xlsx      s3://$BUCKET/raw/orders/orders_apr_2025.xlsx
          aws s3 cp /tmp/order_items.xlsx s3://$BUCKET/raw/order_items/order_items_apr_2025.xlsx

      - name: "[Good] Signal pipeline (_READY)"
        if: github.event.inputs.data_type == 'good'
        run: |
          BUCKET="${{ steps.bucket.outputs.name }}"
          touch /tmp/_READY && aws s3 cp /tmp/_READY s3://$BUCKET/raw/_READY
          echo "Pipeline triggered."

      # ── Bad data ──────────────────────────────────────────────────────────
      - name: "[Bad] Generate bad data"
        if: github.event.inputs.data_type == 'bad'
        run: python scripts/generate_data.py --type bad

      - name: "[Bad] Upload bad data files to S3"
        if: github.event.inputs.data_type == 'bad'
        run: |
          BUCKET="${{ steps.bucket.outputs.name }}"
          aws s3 cp /tmp/products.csv     s3://$BUCKET/raw/products/products_bad.csv
          aws s3 cp /tmp/orders.xlsx      s3://$BUCKET/raw/orders/orders_bad.xlsx
          aws s3 cp /tmp/order_items.xlsx s3://$BUCKET/raw/order_items/order_items_bad.xlsx

      - name: "[Bad] Signal pipeline (_READY)"
        if: github.event.inputs.data_type == 'bad'
        run: |
          BUCKET="${{ steps.bucket.outputs.name }}"
          aws s3api put-object --bucket $BUCKET --key raw/_READY --body /dev/null
          echo "Pipeline triggered. Check s3://$BUCKET/rejected/ after it completes."
