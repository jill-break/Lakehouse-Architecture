name: Destroy Infrastructure

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DESTROY to confirm"
        required: true

# Shares the lock group with the apply workflow so a destroy can never
# interleave with an apply against the same state.
concurrency:
  group: lakehouse-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  destroy:
    name: Terraform Destroy
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'DESTROY'

    permissions:
      id-token: write
      contents: read

    env:
      TF_VAR_aws_region: "us-east-1"
      TF_VAR_environment: "dev"
      TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: "us-east-1"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.10"

      - name: Terraform Init (main)
        working-directory: terraform
        run: terraform init

      - name: Empty S3 bucket before destroy
        run: |
          BUCKET=$(cd terraform && terraform output -raw s3_bucket_name)
          echo "Emptying s3://$BUCKET ..."
          aws s3 rm "s3://$BUCKET" --recursive
          echo "Bucket emptied."

      - name: Delete Athena workgroup contents
        run: |
          aws athena delete-work-group \
            --work-group ecommerce-lakehouse-dev \
            --recursive-delete-option 2>/dev/null || echo "Workgroup already gone."

      - name: Terraform Destroy (main)
        working-directory: terraform
        run: terraform destroy -auto-approve

      - name: Done
        run: |
          echo "Infrastructure destroyed."
          echo ""
          echo "Bootstrap (OIDC provider + CI roles) lives in a separate state"
          echo "that this workflow never touches, so CI can still authenticate"
          echo "on the next push to main. It is also deliberately outside the"
          echo "deploy role's permissions — CI cannot rewrite its own trust"
          echo "policy. Apply terraform/bootstrap by hand if it ever needs to"
          echo "change."
